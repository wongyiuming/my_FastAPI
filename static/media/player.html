<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{PAGE_TITLE}}</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; flex-direction: row-reverse; }
        .player-section { flex: 3; background: #000; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; touch-action: none; }
        .artplayer-app { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .audio-cover-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; background-size: cover; background-position: center; z-index: 1; pointer-events: none; }
        .audio-blur-bg { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(40px) brightness(0.4); transform: scale(1.1); }
        .audio-disk { width: 250px; height: 250px; border-radius: 50%; border: 8px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 2; background-size: cover; background-position: center; }
        .rotate-disk { animation: rotate 20s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .sidebar { flex: 1; min-width: 280px; background: #181818; border-right: 1px solid #282828; display: flex; flex-direction: column; z-index: 10; touch-action: pan-y; }
        .sidebar-header { padding: 20px; font-size: 16px; font-weight: bold; border-bottom: 1px solid #282828; display: flex; justify-content: space-between; align-items: center; background: #181818; }
        .back-btn { color: #888; text-decoration: none; font-size: 14px; }
        .back-btn:hover { color: #fff; }
        .player-controls { padding: 12px 15px; background: #1f1f1f; display: flex; gap: 10px; border-bottom: 1px solid #282828; }
        .control-btn { flex: 1; background: #2a2a2a; color: #fff; border: 1px solid #3a3a3a; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: center; transition: background 0.2s; user-select: none; }
        .control-btn:hover { background: #3a3a3a; }
        .media-list { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0; -webkit-overflow-scrolling: touch; touch-action: pan-y; will-change: transform; }
        .media-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; transition: background 0.2s; user-select: none; }
        .media-item:hover { background: #282828; }
        .media-item.active { background: #333; border-right: 4px solid #3498db; border-left: none; }
        .media-item img { width: 50px; height: 50px; border-radius: 6px; margin-right: 15px; object-fit: cover; pointer-events: none; }
        .media-info { flex: 1; overflow: hidden; }
        .media-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-artist { font-size: 12px; color: #888; }

        .gesture-hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; pointer-events: none; z-index: 100; display: none; }

        /* 强制用户点击的引导层 */
        .start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(10px); }
        .start-overlay h2 { margin: 0; font-size: 28px; color: #fff; }
        .start-overlay p { margin-top: 15px; font-size: 16px; color: #bbb; max-width: 80%; text-align: center; line-height: 1.5; }
        .play-icon { width: 80px; height: 80px; fill: #3498db; margin-bottom: 20px; transition: transform 0.2s; }
        .start-overlay:hover .play-icon { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="player-section" id="playerSection">
        <div id="audioCover" class="audio-cover-container">
            <div id="audioBlurBg" class="audio-blur-bg"></div>
            <div id="audioDisk" class="audio-disk"></div>
        </div>
        <div id="artplayer" class="artplayer-app"></div>
        <div id="gestureHud" class="gesture-hud"></div>

        <!-- 启动遮罩：抢占系统媒体焦点的关键 -->
        <div id="startOverlay" class="start-overlay">
            <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <h2>点击屏幕开始播放</h2>
            <p>由于车机系统安全限制，必须由您的真实点击触发播放<br>才能成功接管方向盘滚轮控制权</p>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>播放列表</span>
            <a href="{{CATEGORY_LIST_URL}}" class="back-btn">← 返回分类</a>
        </div>
        <div class="player-controls">
            <button class="control-btn" onclick="playPrev()">⏮ 上一首</button>
            <button class="control-btn" onclick="playNext()">下一首 ⏭</button>
        </div>
        <ul id="mediaList" class="media-list"></ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.1.1/artplayer.js"></script>
    <script>
        let art = null;
        let currentIndex = 0;
        let isNextPreloaded = false;
        const currentMediaList = {{MEDIA_JSON}};
        let hasStarted = false;

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                // 绑定标准的上一曲/下一曲事件
                navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
                navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
                // 特斯拉有时将滚轮动作识别为 seek，作为冗余一并拦截
                navigator.mediaSession.setActionHandler('seekbackward', () => playPrev());
                navigator.mediaSession.setActionHandler('seekforward', () => playNext());
                navigator.mediaSession.setActionHandler('play', () => { if (art) art.play(); });
                navigator.mediaSession.setActionHandler('pause', () => { if (art) art.pause(); });
            }
        }

        function updateMediaSessionMetadata(media) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: media.title || '未知曲目',
                    artist: media.artist || '私有云端',
                    album: '{{PAGE_TITLE}}',
                    artwork: [
                        { src: media.cover, sizes: '512x512', type: 'image/png' }
                    ]
                });
            }
        }

        function updatePositionState() {
            if ('mediaSession' in navigator && art && art.duration) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: art.duration || 0,
                        playbackRate: art.playbackRate || 1,
                        position: art.currentTime || 0
                    });
                } catch (e) {}
            }
        }

        function checkAndPreloadNext(currentTime) {
            if (currentTime >= 20 && !isNextPreloaded) {
                isNextPreloaded = true;
                if (!currentMediaList || currentMediaList.length <= 1) return;
                const nextIndex = (currentIndex + 1) % currentMediaList.length;
                const nextUrl = currentMediaList[nextIndex].url;

                fetch(nextUrl, { method: 'GET', headers: { 'Range': 'bytes=0-2097152' } })
                    .catch(() => {});
            }
        }

        function playNext() {
            if (!currentMediaList || currentMediaList.length === 0) return;
            const nextIndex = (currentIndex + 1) % currentMediaList.length;
            selectMedia(nextIndex);
        }

        function playPrev() {
            if (!currentMediaList || currentMediaList.length === 0) return;
            const prevIndex = (currentIndex - 1 + currentMediaList.length) % currentMediaList.length;
            selectMedia(prevIndex);
        }

        function initPlayer(media, index) {
            currentIndex = index;
            isNextPreloaded = false;
            const isAudio = media.type === 'audio';
            const audioCover = document.getElementById('audioCover');
            const audioDisk = document.getElementById('audioDisk');
            const audioBlurBg = document.getElementById('audioBlurBg');

            if (isAudio) {
                audioCover.style.display = 'flex';
                audioDisk.style.backgroundImage = `url('${media.cover}')`;
                audioBlurBg.style.backgroundImage = `url('${media.cover}')`;
            } else {
                audioCover.style.display = 'none';
            }

            if (art) {
                art.switchUrl(media.url).then(() => {
                    art.title = media.title;
                    art.play();
                    if (isAudio) audioDisk.classList.add('rotate-disk');
                    else audioDisk.classList.remove('rotate-disk');
                    updateMediaSessionMetadata(media);
                }).catch(() => {
                    art.url = media.url;
                    art.play();
                    updateMediaSessionMetadata(media);
                });
                return;
            }

            art = new Artplayer({
                container: '#artplayer',
                url: media.url,
                title: media.title,
                volume: 1.0,       // 默认满音量
                muted: false,      // 强制不静音，车机底层据此判断是否下发音频焦点
                autoplay: true,
                autoSize: true,
                fullscreen: true,
                fullscreenWeb: true,
            });

            art.on('play', () => {
                if (media.type === 'audio') audioDisk.classList.add('rotate-disk');
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
                updatePositionState();
                setupMediaSession(); // 确保每次播放时都激活控制权
            });

            art.on('pause', () => {
                audioDisk.classList.remove('rotate-disk');
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
                updatePositionState();
            });

            art.on('video:timeupdate', () => checkAndPreloadNext(art.currentTime));
            art.on('video:ended', () => playNext());

            updateMediaSessionMetadata(media);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function initGestureControl() {
            const playerSection = document.getElementById('playerSection');
            const gestureHud = document.getElementById('gestureHud');

            let touchStartX = 0, touchStartY = 0;
            let initialTime = 0, targetTime = 0;
            let isDragging = false;

            playerSection.addEventListener('touchstart', (e) => {
                if (e.touches.length > 1 || !art) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                initialTime = art.currentTime;
                targetTime = initialTime;
                isDragging = false;
            }, { passive: false });

            playerSection.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1 || !art) return;
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;

                if (!isDragging && Math.abs(deltaX) > 10 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    isDragging = true;
                }

                if (isDragging) {
                    e.preventDefault();
                    const duration = art.duration || 1;
                    const seekOffset = deltaX * 0.2;
                    targetTime = Math.min(Math.max(0, initialTime + seekOffset), duration);
                    gestureHud.innerText = `${seekOffset >= 0 ? '+' : ''}${Math.round(seekOffset)}s (${formatTime(targetTime)} / ${formatTime(duration)})`;
                    gestureHud.style.display = 'block';
                }
            }, { passive: false });

            playerSection.addEventListener('touchend', () => {
                if (isDragging && art) {
                    art.currentTime = targetTime;
                    gestureHud.style.display = 'none';
                    isDragging = false;
                }
            });

            playerSection.addEventListener('touchcancel', () => {
                if (isDragging) {
                    gestureHud.style.display = 'none';
                    isDragging = false;
                }
            });
        }

        function selectMedia(index) {
            // 无论从哪里触发（列表点击），都视为已通过用户验证，隐藏遮罩
            const overlay = document.getElementById('startOverlay');
            if (overlay) overlay.style.display = 'none';
            hasStarted = true;

            const items = document.querySelectorAll('.media-item');
            items.forEach(item => item.classList.remove('active'));

            const targetElement = items[index];
            if (targetElement) {
                targetElement.classList.add('active');
                targetElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            initPlayer(currentMediaList[index], index);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('mediaList');
            if (currentMediaList.length === 0) {
                listContainer.innerHTML = '<li style="padding:20px;color:#666;text-align:center;">该分类下暂无媒体数据</li>';
                document.getElementById('startOverlay').style.display = 'none';
                return;
            }

            listContainer.innerHTML = currentMediaList.map((item, index) => `
                <li class="media-item ${index === 0 ? 'active' : ''}" onclick="selectMedia(${index})">
                    <img src="${item.cover}" alt="cover">
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="media-artist">${item.artist}</div>
                    </div>
                </li>
            `).join('');

            initGestureControl();

            // 监听启动遮罩点击，触发首次播放获取焦点
            document.getElementById('startOverlay').addEventListener('click', () => {
                if (!hasStarted) {
                    selectMedia(0);
                }
            });
        });

        // 冗余物理按键拦截
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            const code = e.code;
            if (key === 'MediaTrackNext' || code === 'MediaTrackNext') {
                e.preventDefault();
                playNext();
            } else if (key === 'MediaTrackPrevious' || code === 'MediaTrackPrevious') {
                e.preventDefault();
                playPrev();
            }
        }, true);
    </script>
</body>
</html>
