services:
  # 后端服务
  web:
    build: .
    container_name: office_automation_web
    restart: always
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./static:/app/static

  # Redis 服务
  redis:
    image: redis:7-alpine
    container_name: office_automation_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Nginx 服务
  nginx:
    build: ./nginx
    container_name: office_automation_nginx
    restart: always
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./static:/app/static:ro
      - ${SSL_CERT_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - web

volumes:
  redis_data: